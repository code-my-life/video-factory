[project]
name = "video-factory"
version = "0.3.0"
description = "Monteur vidéo de Code My Life : la commande vf, de la prise au master."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "ai-edge-litert==2.3.0",
    "jsonschema==4.26.0",
    "numpy==2.5.4",
]

[project.scripts]
vf = "video_factory.cli:main"

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
]

[build-system]
requires = ["uv_build==0.12.3"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "video_factory"
module-root = "pipeline"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["pipeline", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "B", "C4", "UP", "SIM", "PIE", "PTH", "RET", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = ["acceptance(name): an acceptance test of an issue, carrying the exact name the issue gives it"]
