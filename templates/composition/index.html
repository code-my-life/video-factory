<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- Provisional template of video-factory (pass "video"): one font, white text, black shots, until the video design system. -->
    <style>
      @font-face {
        font-family: "VF Provisoire";
        src: url("assets/fonts/Inter-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: #000;
      }
      #root {
        position: relative;
        width: 1440px;
        height: 2560px;
        overflow: hidden;
        background: #000;
        font-family: "VF Provisoire", sans-serif;
        font-weight: 700;
        color: #fff;
      }
      #camera-wrap {
        position: absolute;
        left: 0;
        top: 0;
        width: 1440px;
        height: 2560px;
        transform-origin: 50% 40%;
      }
      #camera {
        position: absolute;
        left: 0;
        top: 0;
        width: 1440px;
        height: 2560px;
        object-fit: cover;
      }
      .vf-shot {
        position: absolute;
        left: 0;
        top: 0;
        width: 1440px;
        height: 2560px;
        background: #000;
        visibility: hidden;
      }
      .vf-area {
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 40px;
        overflow: hidden;
      }
      .vf-area img,
      .vf-area video {
        width: 100%;
        height: 100%;
        object-fit: contain;
        transform-origin: 50% 50%;
      }
      .vf-text {
        color: #fff;
        line-height: 1.2;
        text-shadow:
          0 0 12px rgba(0, 0, 0, 0.85),
          0 4px 10px rgba(0, 0, 0, 0.7);
      }
      #caption-layer {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-width="1440" data-height="2560">
{{CAMERA}}
{{SHOTS}}
      <div id="caption-layer" style="{{CAPTION_BOX}}"><div id="caption" class="vf-text"></div></div>
    </div>
    <script id="vf-data" type="application/json">{{DATA}}</script>
    <script src="vf-frames.js"></script>
  </body>
</html>
