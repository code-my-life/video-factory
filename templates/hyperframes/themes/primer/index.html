<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- Theme « primer » of a showcase (#28): Primer's dark tokens and Mona Sans, as factory-live. montage.py fills
         {{DURATION}}, {{BODY}} (the shots, the PR twins, the banner, the end card and the captions, each a clip) and
         {{CONFIG}} (their times). The look of video 1, validated on 2026-11-05; on 2026-11-06 its banner moved into
         the safe zone (centred on it, its text on two lines if need be) and the end card's rows came in from below, so
         no text goes under TikTok's buttons (qc). Nothing is fetched. -->
    <script src="assets/lib/gsap/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Mona Sans";
        font-weight: 200 900;
        src: url("assets/fonts/MonaSans-wght-latin.woff2") format("woff2");
      }
      :root {
        --canvas: #010409;
        --overlay: #151b23;
        --border: #3d444d;
        --fg: #f0f6fc;
        --muted: #9198a1;
        --accent: #4493f8;
      }
      html, body { margin: 0; padding: 0; background: var(--canvas); }
      #root { position: relative; width: 1440px; height: 2560px; overflow: hidden; background: var(--canvas);
        font-family: "Mona Sans", sans-serif; color: var(--fg); }
      .shot, #end { position: absolute; left: 0; top: 0; width: 1440px; height: 2560px; }
      /* The banner is centred on the safe zone (6 % on the left, 17,8 % on the right), never wider than it can grow. */
      #cta { position: absolute; left: 86px; top: 430px; width: 1098px; display: flex; justify-content: center; }
      .cta-card { display: flex; align-items: center; gap: 44px; padding: 40px 64px 44px 44px; border-radius: 48px;
        box-sizing: border-box; max-width: 1000px;
        background: rgba(21, 27, 35, 0.96); border: 4px solid var(--accent);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), 0 0 0 12px rgba(68, 147, 248, 0.14); }
      .cta-card img { flex: none; width: 150px; height: 150px; border-radius: 34px; }
      .cta-title { font-size: 92px; font-weight: 750; line-height: 1; letter-spacing: -0.01em; }
      .cta-sub { margin-top: 16px; font-size: 46px; line-height: 1.15; color: var(--muted); }
      #end { background: radial-gradient(70% 45% at 50% 34%, #0d2142 0%, #08101e 50%, var(--canvas) 100%); }
      .end { position: absolute; left: 0; top: 400px; width: 1440px; display: flex; flex-direction: column;
        align-items: center; }
      .brand { display: flex; align-items: center; gap: 40px; }
      .brand img { width: 150px; height: 150px; border-radius: 34px; }
      .brand span { font-size: 132px; font-weight: 750; letter-spacing: -0.025em; }
      .badge { margin-top: 36px; display: flex; align-items: center; gap: 20px; padding: 18px 40px;
        border: 3px solid var(--border); border-radius: 999px; font-size: 48px; font-weight: 600; color: var(--fg);
        background: rgba(21, 27, 35, 0.8); }
      .rows { margin-top: 56px; display: flex; flex-direction: column; gap: 28px; width: 1180px; }
      .row { display: flex; align-items: center; gap: 40px; padding: 30px 48px; border-radius: 44px;
        background: rgba(21, 27, 35, 0.92); border: 3px solid var(--border); }
      .row-icon { flex: none; width: 110px; height: 110px; border-radius: 32px; display: flex; align-items: center;
        justify-content: center; background: #0d1117; border: 3px solid var(--border); }
      .row-title { font-size: 66px; font-weight: 700; line-height: 1.05; }
      .row-sub { margin-top: 8px; font-size: 38px; color: var(--muted); }
      .twins-ground { position: absolute; left: 0; top: 0; width: 1440px; height: 2560px;
        background: radial-gradient(70% 45% at 50% 34%, #0d2142 0%, #08101e 50%, var(--canvas) 100%); }
      .twin { position: absolute; left: 0; top: 520px; width: 1440px; height: 938px; }
      #twin-tags { position: absolute; left: 0; top: 0; width: 1440px; height: 2560px; }
      .twin-line { position: absolute; top: 500px; left: 0; width: 8px; height: 978px; margin-left: -4px;
        background: var(--accent); box-shadow: 0 0 30px rgba(68, 147, 248, 0.8); opacity: 0; }
      .tag { position: absolute; top: 400px; left: 50%; transform: translateX(-50%); white-space: nowrap;
        font-size: 64px; font-weight: 700; padding: 18px 44px 22px; border-radius: 999px;
        background: rgba(13, 17, 23, 0.94); border: 3px solid var(--border); }
      #tag-apres { border-color: var(--accent); opacity: 0; }
      .cap { position: absolute; left: 96px; top: 1424px; width: 1078px; height: 220px; display: flex;
        align-items: center; justify-content: center; }
      .cap-text { font-size: 84px; font-weight: 800; line-height: 1.08; text-align: center; color: #fff;
        text-shadow: 0 0 6px #000, 0 6px 24px rgba(0, 0, 0, 0.85); paint-order: stroke; -webkit-text-stroke: 10px #000; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="{{DURATION}}" data-fps="30"
      data-width="1440" data-height="2560">
      {{BODY}}
    </div>
    <script id="montage-config" type="application/json">{{CONFIG}}</script>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};
        var config = JSON.parse(document.getElementById("montage-config").textContent);
        var tl = gsap.timeline({ paused: true });
        var cta = config.cta;
        if (cta) {
          tl.fromTo(".cta-card", { opacity: 0, y: -60, filter: "blur(10px)" },
            { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.35, ease: "power3.out" }, cta[0]);
          tl.to(".cta-card", { scale: 1.04, duration: 0.25, ease: "power2.inOut", yoyo: true, repeat: 1 }, cta[0] + 1.2);
          tl.to(".cta-card", { opacity: 0, y: -60, filter: "blur(10px)", duration: 0.25, ease: "power2.in" }, cta[1] - 0.25);
        }
        if (config.end) {
          var end = config.end[0];
          tl.from("#end", { opacity: 0, duration: 0.3, ease: "power2.out" }, end);
          if (document.getElementById("brand")) {
            tl.from("#brand", { opacity: 0, y: 50, filter: "blur(12px)", duration: 0.45, ease: "power3.out" }, end + 0.1);
          }
          if (document.getElementById("badge")) {
            tl.from("#badge", { opacity: 0, y: 30, duration: 0.35, ease: "power3.out" }, end + 0.35);
          }
          // The rows come in from below: a slide from the right would cross the safe zone.
          for (var r = 0; r < config.rows.length; r++) {
            tl.from("#row-" + r, { opacity: 0, y: 40, duration: 0.4, ease: "power3.out" }, end + 0.6 + r * 0.18);
          }
          // Each row pulses when the voice names it.
          config.rows.forEach(function (at, r) {
            tl.to("#row-" + r, { scale: 1.04, borderColor: "#4493f8", duration: 0.2, ease: "power2.out" }, at);
            tl.to("#row-" + r, { scale: 1, borderColor: "#3d444d", duration: 0.35, ease: "power2.inOut" }, at + 0.9);
          });
        }
        if (config.twins) {
          // The PR twins: « before » holds, then « after » wipes in from the left, a blue line on its edge.
          var tw = config.twins.start + config.twins.wipe[0];
          var wipe = config.twins.wipe[1];
          tl.set("#twin-apres", { clipPath: "inset(0% 100% 0% 0%)" }, 0);
          tl.to("#twin-apres", { clipPath: "inset(0% 0% 0% 0%)", duration: wipe, ease: "power2.inOut" }, tw);
          tl.set(".twin-line", { opacity: 1, x: 0 }, tw);
          tl.to(".twin-line", { x: 1440, duration: wipe, ease: "power2.inOut" }, tw);
          tl.set(".twin-line", { opacity: 0 }, tw + wipe);
          tl.to("#tag-avant", { opacity: 0, duration: 0.2 }, tw);
          tl.to("#tag-apres", { opacity: 1, duration: 0.25 }, tw + wipe * 0.6);
        }
        for (var c = 0; c < config.captions; c++) {
          var clipEl = document.getElementById("cap-" + c);
          var at = parseFloat(clipEl.getAttribute("data-start"));
          tl.fromTo("#cap-" + c + " .cap-text", { scale: 0.86, opacity: 0 },
            { scale: 1, opacity: 1, duration: 0.12, ease: "power2.out" }, at);
        }
        tl.set({}, {}, {{DURATION}});
        window.__timelines["main"] = tl;
      })();
    </script>
  </body>
</html>
