<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!--
      The « etapes » shot of video-factory, from the registry block mk-specs-list (hyperframes add, registry at
      v0.9.12; the file as installed is in git history and its fingerprint in hyperframes.lock.json). Provisional
      restyle until the video design system: full frame on black, white rows, one font, a white hairline instead of
      the accent, the column fitted to the shot box of compose. compose writes one copy per shot: ID prefixes every
      id, DURATION is the shot length in seconds, CONFIG holds the steps and the box.
    -->
    <style>
      @font-face {
        font-family: "VF Provisoire";
        src: url("assets/fonts/Inter-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
      }
      #{{ID}}-root {
        --mk-font: "VF Provisoire", sans-serif;
        --mk-ink: #ffffff;
        --mk-line: rgba(255, 255, 255, 0.25);
        --mk-line-fill: #ffffff;
        --mk-hairline: 4px;

        position: relative;
        width: 1440px;
        height: 2560px;
        overflow: hidden;
        background: #000;
      }
      #{{ID}}-col {
        position: absolute;
        display: flex;
        flex-direction: column;
      }
      .{{ID}}-row {
        font-family: var(--mk-font);
        line-height: 1.2;
        opacity: 0;
      }
      .{{ID}}-label {
        display: block;
        font-weight: 700;
        letter-spacing: -0.015em;
        white-space: nowrap;
        color: var(--mk-ink);
      }
      .{{ID}}-line {
        position: relative;
        margin-top: 22px;
        height: var(--mk-hairline);
        background: var(--mk-line);
        border-radius: 2px;
        overflow: hidden;
      }
      .{{ID}}-line-fill {
        position: absolute;
        inset: 0;
        background: var(--mk-line-fill);
        transform-origin: left center;
      }
    </style>
  </head>
  <body>
    <div
      id="{{ID}}-root"
      data-composition-id="{{ID}}"
      data-start="0"
      data-duration="{{DURATION}}"
      data-width="1440"
      data-height="2560"
    >
      <div id="{{ID}}-col"></div>
      <div
        id="{{ID}}-drv"
        class="clip"
        data-start="0"
        data-duration="{{DURATION}}"
        data-track-index="0"
        style="position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none"
      ></div>
    </div>
    <script>
      (function () {
        window.__timelines = window.__timelines || {};

        /* compose writes the rows (one label per step), the shot box in pixels and the largest font size. */
        var CONFIG = {{CONFIG}};

        var DUR = {{DURATION}};
        var ID = "{{ID}}";
        var col = document.getElementById(ID + "-col");
        var count = CONFIG.rows.length;
        var LINE = 22 + 4;

        /* One size for every row: the largest that fits the box, each label on one line. */
        var measure = document.createElement("canvas").getContext("2d");
        var size = Math.min(CONFIG.size, Math.floor((CONFIG.box.height - count * LINE) / (count * 1.2 + (count - 1) * 0.6)));
        CONFIG.rows.forEach(function (r) {
          measure.font = "700 " + size + 'px "VF Provisoire"';
          var width = measure.measureText(r.label).width;
          if (width > CONFIG.box.width - 8) size = Math.floor((size * (CONFIG.box.width - 8)) / width);
        });

        CONFIG.rows.forEach(function (r, i) {
          var row = document.createElement("div");
          row.id = ID + "-row-" + i;
          row.className = ID + "-row";
          if (i > 0) row.style.marginTop = Math.round(size * 0.6) + "px";
          var label = document.createElement("span");
          label.className = ID + "-label";
          label.style.fontSize = size + "px";
          label.textContent = r.label;
          row.appendChild(label);
          var line = document.createElement("div");
          line.className = ID + "-line";
          line.style.width = CONFIG.box.width + "px";
          var fill = document.createElement("div");
          fill.id = ID + "-fill-" + i;
          fill.className = ID + "-line-fill";
          line.appendChild(fill);
          row.appendChild(line);
          col.appendChild(row);
        });

        /* The column, centred in the box. */
        var colH = col.getBoundingClientRect().height;
        col.style.left = CONFIG.box.left + "px";
        col.style.top = Math.round(CONFIG.box.top + (CONFIG.box.height - colH) / 2) + "px";

        /* The rows arrive over the first 60 % of the shot, one after the other, and stay until the cut. */
        var stagger = count > 1 ? Math.min(0.6, Math.max(0.08, (0.6 * DUR - 0.9) / (count - 1))) : 0;
        var tl = gsap.timeline({ paused: true });
        CONFIG.rows.forEach(function (r, i) {
          var row = document.getElementById(ID + "-row-" + i);
          var fill = document.getElementById(ID + "-fill-" + i);
          var t0 = 0.15 + i * stagger;
          tl.fromTo(row, { opacity: 0, x: -36 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, t0);
          tl.fromTo(fill, { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power2.inOut" }, t0 + 0.1);
        });

        window.__timelines[ID] = tl;
      })();
    </script>
  </body>
</html>
